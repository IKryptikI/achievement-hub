<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password · Achievement Hub</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ah-theme")||"dark"}catch(e){}</script>
<meta property="og:site_name" content="Achievement Hub">
<meta property="og:type" content="website">
<meta property="og:title" content="Log in · Achievement Hub">
<meta property="og:description" content="Achievements for the PC games that never had them. Free and open source.">
<meta property="og:image" content="https://achievementhub.pages.dev/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/logo-1.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<main><section><div class="wrap card reveal" style="max-width:480px">
  <h1>Set a new password</h1>
  <form id="f">
    <label for="pw">New password</label><input id="pw" type="password" required minlength="8" autocomplete="new-password">
    <div id="msg"></div>
    <p style="margin-top:18px"><button class="btn primary">Save and log in</button></p>
  </form>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  passwordField($('#pw')); strengthMeter($('#pw'));
  const token = new URLSearchParams(location.search).get('t');
  if (!token) note($('#msg'), 'This page needs the link from the reset email.');
  $('#f').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('/reset', { method: 'POST', body: { token, new_password: $('#pw').value } }); location.href = 'account.html'; }
    catch (err) { note($('#msg'), err.message); }
  });
});
</script>
</body></html>
