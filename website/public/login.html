<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Achievement Hub</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ah-theme")||"dark"}catch(e){}</script>
<meta property="og:site_name" content="Achievement Hub">
<meta property="og:type" content="website">
<meta property="og:title" content="Log in · Achievement Hub">
<meta property="og:description" content="Achievements for the PC games that never had them. Free and open source.">
<meta property="og:image" content="https://achievementhub.pages.dev/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/logo-1.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<main><section><div class="wrap card reveal" style="max-width:480px">
  <h1>Log in</h1>
  <form id="f">
    <label for="gt">Gamertag or email</label><input id="gt" required autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
    <div id="msg"></div>
    <p style="margin-top:18px"><button class="btn primary">Log in</button></p>
  </form>
  <p class="muted"><a href="recover.html">Forgot your password?</a> · New here? <a href="signup.html">Create an account</a>.</p>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', () => passwordField($('#pw')));
document.addEventListener('DOMContentLoaded', () => $('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/login', { method: 'POST', body: { gamertag: $('#gt').value, password: $('#pw').value } });
    location.href = new URLSearchParams(location.search).get('next') || 'account.html';
  } catch (err) { note($('#msg'), err.message); }
}));
</script>
</body></html>
