<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ah-theme")||"dark"}catch(e){}</script>
<title>Admin · Achievement Hub</title>
<meta name="description" content="Admin"><meta name="robots" content="noindex">
<meta property="og:site_name" content="Achievement Hub">
<meta property="og:type" content="website">
<meta property="og:title" content="Admin · Achievement Hub">
<meta property="og:description" content="Admin">
<meta property="og:image" content="https://achievementhub.pages.dev/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/logo-1.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<main><section><div class="wrap reveal">
  <h1>Admin</h1>
  <div id="gate"></div>
  <div id="body" hidden>
    <div class="stats" id="counts"></div>
    <h2 style="margin-top:36px">Reports</h2>
    <div class="filters" id="rtabs"></div>
    <div id="reports"></div>
    <h2 style="margin-top:36px">Mapper applications</h2>
    <div class="filters" id="mtabs"></div>
    <div id="mappers"></div>
    <h2 style="margin-top:36px">Shared mappings</h2>
    <p class="muted">From players' record mode. Download them, then run <code>scripts/merge-submissions.py ~/Downloads/shared-mappings.json</code> and <code>scripts/publish-db.sh</code>.</p>
    <p><button class="btn" id="dlmap">Download new mappings (JSON)</button></p>
    <div id="maps"></div>
    <h2 style="margin-top:36px">Game requests</h2>
    <div id="requests"></div>
    <h2 style="margin-top:36px">Post news</h2>
    <form id="nf" class="card"><input id="nt" placeholder="Title" maxlength="120"><textarea id="nb" rows="5" maxlength="8000" placeholder="What's new?" style="margin-top:10px"></textarea>
      <div id="nmsg"></div><p style="margin:12px 0 0"><button class="btn primary">Publish</button></p></form>
    <div id="news" style="margin-top:14px"></div>
  </div>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const m = await me();
  if (!m || !m.is_admin) { $('#gate').innerHTML = '<p class="muted">This page is for the site admin.</p>'; return; }
  $('#body').hidden = false;
  let data, mtab = 'new';
  const mstat = ['new', 'contacted', 'accepted', 'declined'];
  async function load() {
    data = await api('/admin/summary');
    const c = data.counts;
    $('#counts').innerHTML = [['Members', c.users], ['Linked apps', c.linked], ['Open reports', c.reports], ['Open requests', c.requests], ['Guides', c.guides]]
      .map(([t, n]) => `<div class="card stat"><div class="n">${n}</div><div class="muted">${t}</div></div>`).join('');
    draw();
    reports = (await api('/admin/reports')).reports;
    drawReports();
    const reqs = (await api('/requests')).requests;
    $('#requests').innerHTML = reqs.map((r) => `<div class="ach"><b style="min-width:60px">▲ ${r.votes}</b><div class="body"><b>${esc(r.title)}</b><p>${esc(r.store)} ${r.by ? '· ' + esc(r.by) : ''} ${r.notes ? '· ' + esc(r.notes) : ''}</p></div>
      <select data-req="${r.id}" style="width:auto">${['open', 'planned', 'added', 'declined'].map((s) => `<option${s === r.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>`).join('') || '<p class="muted">No requests.</p>';
    const maps = (await api('/admin/mappings')).mappings;
    $('#maps').innerHTML = maps.map((x) => `<div class="ach"><div class="body"><b>${esc(x.game)} / ${esc(x.achievement)}</b><p>${esc(x.gamertag || 'anonymous')} · ${new Date(x.created * 1000).toLocaleDateString()} · ${(x.data.candidates || []).length} candidate(s), ${x.data.recordings || 1} recording(s)</p></div>
      <select data-mapst="${x.id}" style="width:auto">${['new', 'merged', 'rejected'].map((s) => `<option${s === x.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>`).join('') || '<p class="muted">None yet.</p>';
    $('#dlmap').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(maps.filter((x) => x.status === 'new'), null, 1)], { type: 'application/json' })); a.download = 'shared-mappings.json'; a.click(); };
    const news = (await api('/news')).news;
    $('#news').innerHTML = news.map((n) => `<div class="ach"><div class="body"><b>${esc(n.title)}</b><p>${new Date(n.created * 1000).toLocaleDateString()}</p></div><button class="btn small danger" data-delnews="${n.id}">Delete</button></div>`).join('');
  }
  let reports = [], rtab = 'open';
  function drawReports() {
    $('#rtabs').innerHTML = ['open', 'done', 'dismissed'].map((s) => `<button data-rt="${s}" class="${s === rtab ? 'on' : ''}">${s} ${reports.filter((r) => r.status === s).length}</button>`).join('');
    const link = (r) => r.content && r.content.thread_id ? `thread.html?t=${r.content.thread_id}${r.kind === 'post' ? '#p' + r.target : ''}` : r.kind === 'tip' && r.content ? `game.html?g=${encodeURIComponent(r.content.game)}` : r.kind === 'user' ? `profile.html?u=${encodeURIComponent(r.target)}` : '#';
    $('#reports').innerHTML = reports.filter((r) => r.status === rtab).map((r) => `
      <div class="card" style="margin-bottom:12px">
        <div class="row" style="justify-content:space-between"><b>${esc(r.kind)} by ${esc((r.content && r.content.gamertag) || r.target)}</b>
          <span class="muted" style="font-size:.85rem">reported by ${esc(r.reporter || '?')} · ${ago(r.created)}</span></div>
        <p style="margin:8px 0"><b>Why:</b> ${esc(r.reason)}</p>
        ${r.content ? `<blockquote style="margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);white-space:pre-wrap">${esc(String(r.content.body || '').slice(0, 600)) || '(empty)'}</blockquote>` : '<p class="muted">(Already deleted.)</p>'}
        <div class="row" style="gap:8px">
          <a class="btn small" href="${link(r)}" target="_blank">Open</a>
          ${r.content && ['post', 'thread', 'tip'].includes(r.kind) ? `<button class="btn small danger" data-rdel="${r.id}">Delete it</button>` : ''}
          ${(r.content && r.content.gamertag) ? `<button class="btn small danger" data-rban="${esc(r.content.gamertag)}">Ban ${esc(r.content.gamertag)}</button>` : ''}
          ${r.status === 'open' ? `<button class="btn small" data-rst="done" data-rid="${r.id}">Handled</button><button class="btn small" data-rst="dismissed" data-rid="${r.id}">Dismiss</button>` : `<button class="btn small" data-rst="open" data-rid="${r.id}">Reopen</button>`}
        </div></div>`).join('') || '<p class="muted">Nothing here.</p>';
  }
  function draw() {
    $('#mtabs').innerHTML = mstat.map((s) => `<button data-mt="${s}" class="${s === mtab ? 'on' : ''}">${s} ${data.mappers.filter((x) => x.status === s).length}</button>`).join('');
    $('#mappers').innerHTML = data.mappers.filter((x) => x.status === mtab).map((x) => `
      <div class="card" style="margin-bottom:12px">
        <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(x.name)} ${x.gamertag ? `<span class="muted">(${esc(x.gamertag)})</span>` : ''}</h3>
          <select data-map="${x.id}" style="width:auto">${mstat.map((s) => `<option${s === x.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>
        <p style="margin:6px 0"><a href="mailto:${esc(x.email)}?subject=Achievement%20Hub%20mapping">${esc(x.email)}</a>${x.discord ? ' · Discord: ' + esc(x.discord) : ''} · ${esc(x.platform)} · ${esc(x.hours)}</p>
        ${x.games ? `<p><b>Games:</b> ${esc(x.games)}</p>` : ''}${x.experience ? `<p><b>Experience:</b> ${esc(x.experience)}</p>` : ''}${x.notes ? `<p><b>Notes:</b> ${esc(x.notes)}</p>` : ''}
        <p class="muted" style="margin:0;font-size:.85rem">Applied ${new Date(x.created * 1000).toLocaleString()}</p></div>`).join('') || '<p class="muted">None.</p>';
  }
  document.addEventListener('click', async (e) => {
    if (e.target.dataset.mt) { mtab = e.target.dataset.mt; draw(); }
    const d = e.target.dataset;
    if (d.rt) { rtab = d.rt; drawReports(); }
    if (d.rst) { await api('/admin/reports/' + d.rid, { method: 'PATCH', body: { status: d.rst } }); load(); }
    if (d.rdel) {
      const r = reports.find((x) => String(x.id) === d.rdel);
      if (!confirm(`Delete this ${r.kind}?`)) return;
      try {
        await api(r.kind === 'post' ? `/forum/posts/${r.target}` : r.kind === 'thread' ? `/forum/${r.target}` : `/guides/${r.target}`, { method: 'DELETE' });
        await api('/admin/reports/' + r.id, { method: 'PATCH', body: { status: 'done' } }); load();
      } catch (err) { alert(err.message); }
    }
    if (d.rban) {
      const reason = prompt(`Ban ${d.rban}? Reason (shown to them):`);
      if (reason === null) return;
      try { await api(`/admin/users/${encodeURIComponent(d.rban)}/ban`, { method: 'POST', body: { banned: true, reason } }); alert(`${d.rban} is banned.`); } catch (err) { alert(err.message); }
    }
    if (e.target.dataset.delnews && confirm('Delete this post?')) { await api('/admin/news/' + e.target.dataset.delnews, { method: 'DELETE' }); load(); }
  });
  document.addEventListener('change', async (e) => {
    if (e.target.dataset.map) { await api('/admin/mappers/' + e.target.dataset.map, { method: 'PATCH', body: { status: e.target.value } }); load(); }
    if (e.target.dataset.mapst) { await api('/admin/mappings/' + e.target.dataset.mapst, { method: 'PATCH', body: { status: e.target.value } }); }
    if (e.target.dataset.req) { await api('/admin/requests/' + e.target.dataset.req, { method: 'PATCH', body: { status: e.target.value } }); }
  });
  $('#nf').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('/admin/news', { method: 'POST', body: { title: $('#nt').value, body: $('#nb').value } }); $('#nt').value = $('#nb').value = ''; note($('#nmsg'), 'Published.', true); load(); }
    catch (err) { note($('#nmsg'), err.message); }
  });
  load();
});
</script>
</body></html>
