<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends · Achievement Hub</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ah-theme")||"dark"}catch(e){}</script>
<meta property="og:site_name" content="Achievement Hub">
<meta property="og:type" content="website">
<meta property="og:title" content="Friends · Achievement Hub">
<meta property="og:description" content="Achievements for the PC games that never had them. Free and open source.">
<meta property="og:image" content="https://achievementhub.pages.dev/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/logo-1.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<main><section><div class="wrap reveal" style="max-width:820px">
  <h1>Friends</h1>
  <div id="gate"></div>
  <div id="body" hidden>
    <form id="add" class="row" style="margin-bottom:24px">
      <input id="gt" placeholder="Add a friend by gamertag" style="max-width:320px">
      <button class="btn primary">Send request</button>
    </form>
    <div id="msg"></div>
    <div id="received"></div>
    <h2>Activity</h2>
    <div id="feed" style="margin-bottom:34px"></div>
    <h2>Your friends</h2>
    <div id="list" class="grid"></div>
    <div id="sent"></div>
  </div>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!(await me())) {
    $('#gate').innerHTML = '<p>Log in to see and add friends. <a class="btn small primary" href="login.html?next=friends.html">Log in</a> <a class="btn small" href="signup.html">Sign up</a></p>';
    return;
  }
  $('#body').hidden = false;
  const person = (f, actions) => `
    <div class="card person">${pic(f, true)}
      <div class="grow"><a href="profile.html?u=${encodeURIComponent(f.gamertag)}"><b>${esc(f.gamertag)}</b></a>
        <div class="muted" style="font-size:.92rem">${f.status === 'friend'
          ? (online(f) ? `<span class="dot on"></span>${f.playing ? 'Playing ' + esc(f.playing) : 'Online'}` : '<span class="dot"></span>Offline')
          : esc(f.motto || '')}</div>
        ${f.status === 'friend' ? `<span class="gs">${f.gamerscore}</span>` : ''}</div>${actions}</div>`;
  async function load() {
    const { friends } = await api('/friends');
    const by = (s) => friends.filter((f) => f.status === s);
    $('#received').innerHTML = by('received').length
      ? '<h2>Friend requests</h2><div class="grid" style="margin-bottom:30px">' + by('received').map((f) => person(f,
          `<button class="btn small primary" data-accept="${esc(f.gamertag)}">Accept</button><button class="btn small" data-remove="${esc(f.gamertag)}">Decline</button>`)).join('') + '</div>'
      : '';
    $('#list').innerHTML = by('friend').length
      ? by('friend').sort((a, b) => online(b) - online(a) || b.gamerscore - a.gamerscore).map((f) => person(f, `<button class="btn small" data-remove="${esc(f.gamertag)}">Remove</button>`)).join('')
      : '<p class="muted">No friends yet. Add someone by their gamertag above.</p>';
    $('#sent').innerHTML = by('sent').length
      ? '<h2 style="margin-top:30px">Sent requests</h2><div class="grid">' + by('sent').map((f) => person(f, `<button class="btn small" data-remove="${esc(f.gamertag)}">Cancel</button>`)).join('') + '</div>'
      : '';
  }
  document.addEventListener('click', async (e) => {
    const a = e.target.dataset.accept, r = e.target.dataset.remove;
    try {
      if (a) await api(`/friends/${encodeURIComponent(a)}/accept`, { method: 'POST' });
      if (r && confirm(`Remove ${r}?`)) await api(`/friends/${encodeURIComponent(r)}`, { method: 'DELETE' });
      if (a || r) load();
    } catch (err) { note($('#msg'), err.message); }
  });
  $('#add').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const r = await api('/friends', { method: 'POST', body: { gamertag: $('#gt').value } });
      note($('#msg'), r.status === 'friend' ? "You're now friends!" : 'Request sent.', true); $('#gt').value = ''; load();
    } catch (err) { note($('#msg'), err.message); }
  });
  load();
  try {
    const { items } = await api('/feed');
    const ago = (t) => { const d = Date.now() / 1000 - t; return d < 3600 ? Math.max(1, Math.round(d / 60)) + 'm ago' : d < 86400 ? Math.round(d / 3600) + 'h ago' : Math.round(d / 86400) + 'd ago'; };
    $('#feed').innerHTML = items.length ? items.slice(0, 20).map((x, i) => `
      <div class="ach" style="animation-delay:${i * 0.03}s">${pic(x, true)}
        <div class="body"><b>${esc(x.gamertag)}</b> unlocked <b>${esc(x.name)}</b><p>${esc(x.title)} · ${ago(x.time)}</p></div><span class="gs pts">${x.points}</span></div>`).join('')
      : '<p class="muted">When your friends unlock achievements, they show up here.</p>';
  } catch {}
});
</script>
</body></html>
