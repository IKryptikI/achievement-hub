<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · Achievement Hub</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ah-theme")||"dark"}catch(e){}</script>
<meta property="og:site_name" content="Achievement Hub">
<meta property="og:type" content="website">
<meta property="og:title" content="Profile · Achievement Hub">
<meta property="og:description" content="Achievements for the PC games that never had them. Free and open source.">
<meta property="og:image" content="https://achievementhub.pages.dev/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logos/logo-1.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<main><section><div class="wrap reveal" style="max-width:900px">
  <div id="p"><p class="muted">Loading…</p></div>
</div></section></main>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const tag = new URLSearchParams(location.search).get('u');
  if (!tag) return ($('#p').innerHTML = '<p>No profile chosen.</p>');
  let p;
  try { p = await api('/users/' + encodeURIComponent(tag)); } catch (err) { return ($('#p').innerHTML = `<p>${esc(err.message)}</p>`); }
  document.title = `${p.gamertag} · Achievement Hub`;
  let favorite = '';
  try { const g = (await games()).find((x) => x.id === p.favorite); if (g) favorite = g.title; } catch {}
  const action = {
    none: `<button class="btn primary" id="add">Add friend</button>`,
    sent: `<span class="muted">Friend request sent</span>`,
    received: `<button class="btn primary" id="acc">Accept friend request</button>`,
    friend: `<span class="muted">Friends ✓</span>`,
    self: `<a class="btn" href="account.html">Edit profile</a>`,
  }[p.relation] || (await me() ? '' : `<a class="btn" href="login.html?next=${encodeURIComponent(location.pathname + location.search)}">Log in to add friend</a>`);
  const status = p.sent !== undefined ? (online(p) ? `<span class="dot on"></span>${p.playing ? 'Playing ' + esc(p.playing) : 'Online'}` : '<span class="dot"></span>Offline') : '';
  // Banner art (a game the player picked) and showcase (picked achievements).
  let bannerArt = '', show = [];
  try {
    const list = await games();
    const bg = list.find((x) => x.id === p.banner);
    if (bg) { const d = await game(bg.id); bannerArt = d.banner || d.cover; }
    const byGame = {};
    for (const pick of (p.showcase || [])) { const [gid, aid] = pick.split('/'); (byGame[gid] ||= []).push(aid); }
    for (const [gid, aids] of Object.entries(byGame)) {
      try { const d = await game(gid); for (const aid of aids) { const a = d.achievements.find((x) => x.id === aid); if (a) show.push({ ...a, game: d.title, gid }); } } catch {}
    }
  } catch {}
  const ADMIN = !!((await me()) || {}).is_admin;
  const pageUrl = `${location.origin}/profile?u=${encodeURIComponent(p.gamertag)}`;
  const cardUrl = `${location.origin}/card/${encodeURIComponent(p.gamertag)}`;
  $('#p').innerHTML = `
    ${bannerArt ? `<div style="height:200px;border-radius:var(--radius) var(--radius) 0 0;margin-bottom:-60px;background:url('${esc(bannerArt)}') center/cover;mask-image:linear-gradient(#000 40%,transparent)"></div>` : ''}
    <div class="gamercard" style="--accent:${esc(p.color)};position:relative">${pic(p)}
      <div style="flex:1"><div class="tag">${esc(p.gamertag)}</div><div class="muted">${esc(p.motto)}</div>
        <span class="gs">${p.gamerscore}</span> ${p.unlocked !== undefined ? `<span class="muted">· ${p.unlocked} achievements</span>` : ''}
        <div style="margin-top:6px">${status}</div></div>
      <div>${action}</div></div>
    <div id="msg"></div>
    <div class="row" style="gap:8px;margin-top:8px">
      ${ADMIN && p.relation !== 'self' && (p.avatar || '').startsWith('img:') ? '<button class="btn small danger" id="rmpic">Remove their picture</button>' : ''}
      ${ADMIN && p.relation !== 'self' ? `<button class="btn small danger" id="ban">${p.banned ? 'Unban' : 'Ban'} ${esc(p.gamertag)}</button>` : ''}
      ${p.relation !== 'self' ? '<button class="report-link" id="rep">Report this profile</button>' : ''}
    </div>
    ${(p.badges || []).length ? `<h2 style="margin-top:28px">Site achievements <span class="muted" style="font-size:1rem">${p.badges.filter((b) => b.unlocked).length} of ${p.badges.length}</span></h2>
      <div class="siteach">${[...p.badges].sort((a, b) => b.unlocked - a.unlocked).map((b) => `<div class="a${b.unlocked ? '' : ' locked'}" title="${esc(b.text)}"><div class="i">${b.unlocked ? b.icon : '🔒'}</div><div><b>${esc(b.name)}</b><span>${esc(b.text)}</span></div></div>`).join('')}</div>` : ''}
    ${show.length ? `<h2 style="margin-top:28px">Showcase</h2><div class="grid">${show.map((a) => `
      <a class="card lift person" href="game.html?g=${encodeURIComponent(a.gid)}">${a.icon ? `<img src="${esc(a.icon)}" alt="" style="width:56px;height:56px;border-radius:10px">` : ''}
        <div class="grow"><b>${esc(a.name)}</b><br><span class="muted" style="font-size:.9rem">${esc(a.game)}</span></div><span class="gs">${a.points}</span></a>`).join('')}</div>` : ''}
    ${p.bio ? `<p style="margin-top:20px;white-space:pre-wrap">${esc(p.bio)}</p>` : ''}
    ${favorite ? `<p class="muted">Favorite game: <b style="color:var(--text)">${esc(favorite)}</b></p>` : ''}
    ${p.games === undefined
      ? `<div class="card" style="margin-top:24px"><p class="muted" style="margin:0">${p.private ? `${esc(p.gamertag)} only shares their games with friends.` : p.relation === 'self' ? 'Link the app on your <a href="account.html">Account</a> page and your games show up here.' : `${esc(p.gamertag)} hasn't linked the app yet.`}</p></div>`
      : `<h2 style="margin-top:30px">Games</h2>
         <div class="grid">${p.games.length ? p.games.map((g) => `
           <a class="card game lift" href="game.html?g=${encodeURIComponent(g.id)}${p.relation === 'friend' ? '&vs=' + encodeURIComponent(p.gamertag) : ''}"><h3>${esc(g.title)}</h3>
             <span class="muted">${g.unlocked} of ${g.total} · <span class="gs">${g.points}</span> / ${g.total_points}</span>
             <div class="bar"><i style="width:${g.total ? Math.round(100 * g.unlocked / g.total) : 0}%"></i></div>${p.relation === 'friend' ? '<span class="muted" style="font-size:.85rem">Compare →</span>' : ''}</a>`).join('') : '<p class="muted">No games yet.</p>'}</div>
         <h2 style="margin-top:30px">Timeline</h2>
         <div id="timeline"><div class="skel" style="height:70px;margin-bottom:8px"></div><div class="skel" style="height:70px"></div></div>`}
    <h2 style="margin-top:30px">Gamercard</h2>
    <div class="card"><img src="/card/${encodeURIComponent(p.gamertag)}.png?v=${Math.floor(Date.now() / 600000)}" alt="${esc(p.gamertag)}'s gamercard" style="width:100%;max-width:600px;border-radius:14px;display:block">
      <p class="muted" style="margin-bottom:6px">Show it off in Discord, forums or your signature:</p>
      <div class="row" style="gap:8px">${[['Link', cardUrl], ['Image', cardUrl + '.png'], ['BBCode', `[url=${pageUrl}][img]${cardUrl}.png[/img][/url]`], ['Markdown', `[![${p.gamertag}](${cardUrl}.png)](${pageUrl})`], ['HTML', `<a href="${pageUrl}"><img src="${cardUrl}.png" alt="${p.gamertag}"></a>`]]
        .map(([k, v]) => `<button class="btn small" data-copy="${esc(k === 'Link' ? pageUrl : v)}">Copy ${k}</button>`).join('')}</div><div id="cmsg"></div></div>
    <p class="muted" style="margin-top:30px">Member since ${new Date(p.member_since * 1000).toLocaleDateString()}</p>`;
  $('#p').addEventListener('click', async (e) => {
    const v = e.target.dataset.copy;
    if (!v) return;
    try { await navigator.clipboard.writeText(v); note($('#cmsg'), 'Copied!', true); } catch { prompt('Copy this:', v); }
  });
  // Timeline: every unlock by day, newest first.
  if (p.games !== undefined) {
    (async () => {
      let unlocks = [];
      try { ({ unlocks } = await api(`/users/${encodeURIComponent(p.gamertag)}/timeline`)); } catch {}
      if (!unlocks.length) return ($('#timeline').innerHTML = '<p class="muted">No achievements yet.</p>');
      const info = {};
      await Promise.all([...new Set(unlocks.map((u) => u.game))].map(async (gid) => {
        try { const d = await game(gid); info[gid] = { title: d.title, ach: Object.fromEntries(d.achievements.map((a) => [a.id, a])) }; } catch {}
      }));
      const dayOf = (t) => {
        if (!t) return 'Earlier';
        const d = new Date(t * 1000), today = new Date();
        const days = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 86400000);
        return days === 0 ? 'Today' : days === 1 ? 'Yesterday' : d.toLocaleDateString(undefined, { weekday: days < 7 ? 'long' : undefined, month: 'long', day: 'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
      };
      let shown = 40;
      const draw = () => {
        let html = '', last = null;
        for (const u of unlocks.slice(0, shown)) {
          const g = info[u.game], a = g && g.ach[u.achievement];
          if (!a) continue;
          const day = dayOf(u.time);
          if (day !== last) { html += `<h3 class="tl-day">${esc(day)}</h3>`; last = day; }
          html += `<a class="tl-item" href="game.html?g=${encodeURIComponent(u.game)}">${a.icon ? `<img src="${esc(a.icon)}" alt="" loading="lazy">` : '<span class="tl-noicon"></span>'}
            <span class="grow"><b>${esc(a.name)}</b><span class="muted">${esc(g.title)}${u.time ? ' · ' + new Date(u.time * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''}</span></span><span class="gs">${a.points}</span></a>`;
        }
        if (unlocks.length > shown) html += `<p><button class="btn small" id="tl-more">Show more (${unlocks.length - shown} left)</button></p>`;
        $('#timeline').innerHTML = html;
        $('#tl-more')?.addEventListener('click', () => { shown += 60; draw(); });
      };
      draw();
    })();
  }
  $('#rep')?.addEventListener('click', () => report('user', p.gamertag));
  $('#ban')?.addEventListener('click', async () => {
    const reason = p.banned ? '' : prompt(`Ban ${p.gamertag}? They'll be logged out and can't log in or post. Reason (shown to them):`);
    if (reason === null) return;
    try { await api(`/admin/users/${encodeURIComponent(p.gamertag)}/ban`, { method: 'POST', body: { banned: !p.banned, reason } }); location.reload(); } catch (err) { note($('#msg'), err.message); }
  });
  $('#rmpic')?.addEventListener('click', async () => {
    if (!confirm(`Remove ${p.gamertag}'s gamer picture?`)) return;
    try { await api(`/admin/users/${encodeURIComponent(p.gamertag)}/picture`, { method: 'DELETE' }); location.reload(); } catch (err) { note($('#msg'), err.message); }
  });
  const act = async (fn) => { try { await fn(); location.reload(); } catch (err) { note($('#msg'), err.message); } };
  $('#add')?.addEventListener('click', () => act(() => api('/friends', { method: 'POST', body: { gamertag: p.gamertag } })));
  $('#acc')?.addEventListener('click', () => act(() => api(`/friends/${encodeURIComponent(p.gamertag)}/accept`, { method: 'POST' })));
});
</script>
</body></html>
