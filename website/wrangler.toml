# Achievement Hub website: static pages (public/) + API (functions/) on
# Cloudflare Pages, with a D1 (SQLite) database for accounts and profiles.
name = "achievementhub"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "achievementhub"
database_id = "b60f5b7f-b754-4c3b-a7a8-62d4a3200ffd"
migrations_dir = "migrations"
