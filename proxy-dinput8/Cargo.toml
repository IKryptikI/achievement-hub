[package]
name = "proxy-dinput8"
version = "0.1.0"
edition = "2024"
build = "../proxy/build.rs"
description = "Achievement Hub's stand-in dinput8.dll (loads overlay.dll)."

[lib]
name = "dinput8"
path = "../proxy/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }
