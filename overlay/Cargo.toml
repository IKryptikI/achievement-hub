[package]
name = "overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
hudhook = { path = "../vendor/hudhook", default-features = false, features = ["dx9", "dx11", "opengl3", "inject"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "Win32_Media_Audio"] }

[lib]
crate-type = ["cdylib"]
