# Silent Hill 3 (PC), achievements imported from Silent Hill HD Collection
# (Xbox 360, 2012), which split one 1000G list between SH2 and SH3; this
# game's share is 500G. Source: Exophase "Silent Hill HD" (Xbox 360).
# Build: sh3.exe (2003 PC release).
# Achievements without `when` are listed but can't unlock yet (their
# memory conditions haven't been found).

[game]
id = "silent-hill-3"
title = "Silent Hill 3"
developer = "Konami Computer Entertainment Tokyo"
publisher = "Konami"
# (Description adapted from Wikipedia, CC BY-SA 4.0. Art: the HD Collection's
# Xbox 360 dashboard background, fetched per player into their profile.)
description = "A direct sequel to the first Silent Hill: teenager Heather Mason becomes entangled in the schemes of the town's cult, which seeks to revive a malevolent deity."
art_url = "https://m.exophase.com/xbox/games/o/35011.png"
year = 2003
# Official icons: the HD Collection's Xbox 360 list, fetched per player into
# their profile (never shipped).
icons_from = "exophase:silent-hill-hd-xbox-360"

[[build]]
exe = "sh3.exe"
timestamp = 0x3f557c0c
image_size = 0x6d7c0a8

