id = "fallout-3-goty"
title = "Fallout 3"
subtitle = "Game of the Year Edition"
icons_from = "exophase:fallout-3-xbox-360"

[engine]
kind = "gamebryo-fallout3"
quest_vtable = 0xb77c80   # TESQuest vtable, relative to the exe
player_rva = 0xe24884     # pointer to the player, relative to the exe
misc_stats_rva = 0xe23230 # Pip-Boy general stats (pointers), relative to the exe

[[build]]
