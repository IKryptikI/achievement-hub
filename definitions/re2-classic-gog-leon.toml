points = 5

[[achievement]]
id = "red_jewel"
name = "Jewel Thief"
description = "Find a Red Jewel."
category = "Leon's Story"
points = 10
when = [
  # Any of the 11 inventory slots (4 bytes each) holds item 0x33.
  { read = "u8", address = 0x999334, stride = 4, count = 11, eq = 0x33 },
]

