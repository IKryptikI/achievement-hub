# Resident Evil 2 (1998) — GOG release, Leon scenario (LeonU.exe).
# Memory map: games/re2-classic-gog.md · Full set plan: games/re2-achievement-set.md
#
# Achievements without `when` are listed in the overlay but can't unlock yet
# (their memory conditions haven't been found). Points total 1000.

[game]
id = "re2-classic-gog"
title = "Resident Evil 2"
subtitle = "Leon"
developer = "Capcom"
publisher = "Capcom"
year = 1998
description = "Two survivors arrive in Raccoon City on the night it falls. Rookie cop Leon S. Kennedy reports for his first day at a police station overrun by the dead, and finds the outbreak was no accident."

[[build]]
exe = "LeonU.exe"
timestamp = 0x370c3909
image_size = 0x5ab000

# ── Leon's Story ────────────────────────────────────────────────
[[achievement]]
id = "leon_start"
name = "Rookie's First Day"
description = "Start the Leon scenario."
category = "Leon's Story"
points = 5

[[achievement]]
id = "rpd"
name = "Welcome to the R.P.D."
description = "Make it inside the police station."
category = "Leon's Story"
points = 10

[[achievement]]
id = "marvin"
name = "Hey, Marvin"
description = "Talk to Marvin in the East Office."
