# The Elder Scrolls IV: Oblivion (2006), Steam GOTY Edition, patch 1.2.0416.
# Achievements imported from the original Xbox 360 release (1000G base +
# 250G Shivering Isles). Source: UESP (Oblivion:Achievements,
# Shivering:Xbox 360 Achievements). Memory map: games/oblivion.md
#
# Factions: Fighters 0x2228F, Mages 0x22296, Thieves 0x24164, Dark
# Brotherhood 0x2F872 (rank 4 Executioner has no achievement), Arena
# 0x299B9, Court of Madness 0x6A7FC (5 Dementia / 6 Mania are exclusive).
# Dementia and Mania are mutually exclusive on one character, as on Xbox.

[game]
id = "oblivion"
title = "The Elder Scrolls IV: Oblivion"
developer = "Bethesda Game Studios"
publisher = "Bethesda Softworks"
year = 2006
# Official icons: Oblivion Remastered's public Steam achievement list
# (fetched per player into their profile, never shipped).
icons_from = "steam:2623190"

# Engine data (xOBSE's GameAPI.cpp / GameObjects.cpp, 1.2.0416). Quest
# stages and faction ranks/IDs come from Oblivion.esm.
[engine]
kind = "gamebryo-oblivion"
player = 0x00B333C4
data_handler = 0x00B33A98

[[build]]
exe = "Oblivion.exe"   # Steam GOTY, 1.2.0416
timestamp = 0x462392c7
image_size = 0x805000


