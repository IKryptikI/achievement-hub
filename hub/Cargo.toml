[package]
name = "hub"
version = "0.3.0"
edition = "2024"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"
ureq = "3.4.2"
